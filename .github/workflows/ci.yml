name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check src tests scripts eval
      - run: ruff format --check src tests scripts eval

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: gitleaks (TC-SEC-007)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  core-with-layer-off:
    name: TC-REV-001 stage 1 suite with FEATURE_GOVERNANCE=false
    runs-on: ubuntu-24.04
    env:
      FEATURE_GOVERNANCE: "false"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: python -m playwright install --with-deps chromium
      - name: gitleaks for TC-SEC-007
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks 2>/dev/null || sudo tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
          rm gitleaks.tgz
      - run: python -m pytest -m "stage1 and not eval and not smoke_live" --junitxml=reports/junit-stage1.xml
      - run: python scripts/test_report.py reports/junit-stage1.xml > reports/test-report.md
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-report
          path: reports/

  stage2-gate:
    name: Stage 2 gate with FEATURE_GOVERNANCE=true
    runs-on: ubuntu-24.04
    env:
      FEATURE_GOVERNANCE: "true"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m "(stage1 or stage2) and not eval and not smoke_live" --junitxml=reports/junit-stage2.xml
      - run: python scripts/test_report.py reports/junit-stage2.xml > reports/test-report-stage2.md
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-report-stage2
          path: reports/

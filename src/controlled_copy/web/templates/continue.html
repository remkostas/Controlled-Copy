{% extends "base.html" %}
{% block title %}{{ product_name }}{% endblock %}
{% block content %}
<main class="cover">
  <article class="sheet">
    <div class="sheet__title sheet__brand">{{ icon('brand') }}<h1>{{ product_name }}</h1></div>
    <p class="sheet__lede">You have no notebook open. Continue to start a new one.</p>
    <form method="post" action="/app/continue">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="btn btn--primary">Continue</button>
    </form>
  </article>
</main>
{% endblock %}

{% from "partials/macros.html" import cites %}
<details class="output" id="output-{{ o.id }}" {% if o.open %}open{% endif %}>
  <summary>
    <span class="output__name">{{ o.title }}</span>
    {% if o.subject %}<span class="output__subject">{{ o.subject }}</span>{% endif %}
    <span class="output__meta">{{ o.meta_label }}</span>
  </summary>
  <div class="output__body">
    {% include "partials/output_body.html" %}
    {% if o.kind == 'ok' %}
    <p class="output__actions">
      <button type="button" class="btn btn--sm" data-copy-markdown="{{ o.md_url }}">{{ icon('copy') }} Copy as Markdown</button>
      <a class="btn btn--sm btn--ghost" href="{{ o.md_url }}?download=true" download>{{ icon('file-text') }} Download .md</a>
      <a class="btn btn--sm btn--ghost" href="{{ o.print_url }}" target="_blank" rel="noopener">{{ icon('files') }} Print</a>
    </p>
    {% endif %}
  </div>
</details>

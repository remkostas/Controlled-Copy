# Local and server deployment: the app on an internal network, Caddy in front with TLS.
# Copy .env.example to .env first. On a public server set APP_MODE=deploy, SITE_ADDRESS to
# the domain and PUBLISH_ADDRESS to 0.0.0.0; locally the defaults serve https://localhost.
# Build with `--pull` so both images start from their newest security patches.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    image: controlled-copy:latest
    env_file: .env
    environment:
      APP_MODE: ${APP_MODE:-deploy}
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # PDF parsing runs in a child process with its own memory limit (PDF_PARSE_MEMORY_MB);
    # these bound the whole container on a small server.
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 30s
    logging: *logging
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2.11
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  app-data:
  caddy-data:
  caddy-config:
